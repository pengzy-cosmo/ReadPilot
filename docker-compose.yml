services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      READPILOT_DATA_DIR: /data
      READPILOT_ALLOWED_ORIGINS: ${READPILOT_ALLOWED_ORIGINS:-http://localhost:5173}
      READPILOT_ALLOW_ANY_ORIGIN: ${READPILOT_ALLOW_ANY_ORIGIN:-}
    volumes:
      - readpilot_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  readpilot_data:
