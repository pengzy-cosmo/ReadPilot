services:
  backend:
    build:
      context: ./backend
    command: sh -c "uv sync --locked && uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi; npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_venv:
  frontend_node_modules:
