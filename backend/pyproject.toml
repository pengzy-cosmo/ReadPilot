[project]
name = "readpilot-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "litellm>=1.80.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.21",
    "uvicorn[standard]>=0.40.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E731", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
